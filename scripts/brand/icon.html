<!DOCTYPE html>
<!-- Source for the favicon and home screen icons. Rendered at 512x512 by
     scripts/render-brand.sh; the "CB" tiles match the header mark. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=block" rel="stylesheet">
<style>
	html, body { margin: 0; width: 512px; height: 512px; background: transparent; }
	.bg {
		position: absolute; inset: 0;
		border-radius: 112px;
		background: linear-gradient(160deg, #1b2550 0%, #0b1026 70%);
		overflow: hidden;
	}
	/* a sliver of sunset sea along the bottom */
	.bg::after {
		content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 92px;
		background:
			repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 8px, transparent 8px 16px) 0 24px / 100% 8px no-repeat,
			linear-gradient(180deg, #9fe3ea 0 8px, #2678aa 8px, #0b3a5c);
	}
	.tile {
		position: absolute; top: 118px;
		width: 196px; height: 196px;
		border-radius: 44px;
		display: grid; place-items: center;
		font: 800 168px/1 "Bricolage Grotesque", sans-serif;
		color: #0b1026;
		box-shadow: 0 18px 0 rgba(0,0,0,.28);
	}
	.c { left: 70px; background: #ff8a3d; transform: rotate(-6deg); }
	.b { left: 234px; background: #ff4d8d; transform: rotate(8deg); }
	.tile span { transform: translateY(-6px); }
</style>
</head>
<body>
	<div class="bg"></div>
	<div class="tile c"><span>C</span></div>
	<div class="tile b"><span>B</span></div>
</body>
</html>
